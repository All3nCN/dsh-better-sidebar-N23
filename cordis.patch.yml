# @all3cn/dsh-better-sidebar bundle patch
#
# This file is the `dsh.bundle.patch` layer of the published npm package: when
# the plugin is installed through the official CLI —
#
#   dsh plugin --profile <name> add @all3cn/dsh-better-sidebar@<version>
#
# — the command reconciles `dsh.profile.bundles` against installed packages
# and, seeing this declaration, appends `@all3cn/dsh-better-sidebar` to the
# bundle stack. The profile boot then merges THIS patch (a single `insert` of
# the plugin row) exactly like a manual cordis.patch.yml mount line. No
# profile file edits needed — one command installs and mounts.
#
# The plugin row id stays the stable `better-sidebar` (the loader identity
# used by settings/state persistence); only the package name is scoped.
#
# If the profile still carries an old manual mount line for `dsh-better-sidebar`
# (upstream or a local fork copy) in its own cordis.patch.yml, remove it before
# switching to this bundle channel to avoid double-mounting (two Node halves,
# two sidebars).
- insert:
    - id: better-sidebar
      name: '@all3cn/dsh-better-sidebar'
